# Install the hooks with: pixi run -e dev pre-commit install
# Keep `rev` in sync with the ruff pin in pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|test)/
      - id: ruff-format
        files: ^(src|test)/
