name: Build wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-13
            archs: x86_64
          - os: macos-14
            archs: arm64
          - os: windows-latest
            archs: AMD64
    steps:
      - uses: actions/checkout@v4

      # hatch_build.py compiles Triangle with mingw on Windows (CC=gcc below).
      - name: Install mingw
        if: runner.os == 'Windows'
        run: choco install --no-progress mingw

      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: "cp313-*"
          # musl has no wheels for the GDAL/geo stack our deps pull in.
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_ENVIRONMENT_WINDOWS: "CC=gcc"
          # Newer manylinux: modern GCC, and numpy/scipy ship matching wheels.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # Linux uses auditwheel (default) to set the manylinux tag. The
          # standalone binary needs no repair on macOS/Windows.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/test"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
