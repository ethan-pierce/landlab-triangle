name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.3
          args: check
          src: src test

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.3
          args: format --check
          src: src test
