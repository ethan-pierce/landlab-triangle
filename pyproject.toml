[project]
authors = [{name = "Ethan", email = "ethan.g.pierce@dartmouth.edu"}]
name = "lltriangle"
requires-python = ">= 3.13"
version = "1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.13"
geopandas = ">=1.1.1,<2"
shapely = ">=2.1.1,<3"
landlab = ">=2.10.1,<3"
ncurses = ">=6.5,<7"
pytest = ">=8.4.1,<9"

[tool.pixi.pypi-dependencies]
lltriangle = { path = ".", editable = true }
triangle = "*"

[tool.pixi.tasks]
