[project]
authors = [{name = "Ethan", email = "ethan.g.pierce@dartmouth.edu"}]
name = "landlab-triangle"
requires-python = ">= 3.13"
version = "1.0.0"
description = "Create unstructured Landlab grids using Jonathan Shewchuk's Triangle mesh generation software"
readme = "README.md"
dependencies = [
    "landlab>=2.10.1",
    "geopandas>=1.1.1",
    "shapely>=2.1.1",
    "xarray>=2024.1.0",
    "netcdf4>=1.6.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["landlab", "triangle", "mesh", "unstructured", "grid"]
license = "MIT"
license-files = ["LICENSE", "NOTICE", "src/landlab_triangle/_triangle_src/LICENSE"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
artifacts = ["src/landlab_triangle/_triangle_bin/*"]

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "NOTICE", "LICENSE", "README.md"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.13"
geopandas = ">=1.1.1,<2"
shapely = ">=2.1.1,<3"
landlab = ">=2.10.1,<3"
xarray = ">=2024.1.0"
netcdf4 = ">=1.6.0"
ncurses = ">=6.5,<7"
pytest = ">=8.4.1,<9"
pip = ">=25.2,<26"

[tool.pixi.pypi-dependencies]
landlab-triangle = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
uxarray = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "==0.16.3"
pre-commit = ">=3.7,<5"

[tool.pixi.feature.dev.tasks]
lint = "ruff check src test"
lint-fix = "ruff check --fix src test"
format = "ruff format src test"
format-check = "ruff format --check src test"

[tool.pixi.environments]
dev = ["dev"]
test = ["test"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "test"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
